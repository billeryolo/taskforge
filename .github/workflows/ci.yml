name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Tests (real Celery worker, in-memory broker, fakeredis)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://taskforge:taskforge@localhost:5432/taskforge_test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
