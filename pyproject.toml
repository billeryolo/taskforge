[project]
name = "taskforge"
version = "0.1.0"
description = "Background-job platform: Celery workers, Beat schedules, Redis caching, retries with backoff, dead-letter queue."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic[email]",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "flower>=2.0",
    "redis>=5.0",
    "pillow>=10.3",
    "reportlab>=4.2",
    "structlog>=24.1",
    "sentry-sdk[fastapi,celery]>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["B008", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
